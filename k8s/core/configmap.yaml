  ADMIN_GRPC_HOST: banquito-core-admin-3p
  ACCOUNTING_GRPC_HOST: banquito-core-contable-3p
  NOTIFICATION_GRPC_HOST: banquito-core-notificaciones-3p
  DOCUMENT_GRPC_HOST: banquito-core-documentos-3p
