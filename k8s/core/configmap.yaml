apiVersion: v1
kind: ConfigMap
metadata:
  name: banquito-core-config
data:
  TZ: America/Guayaquil
  MAILPIT_WEB_PORT: "8025"
  MAILPIT_SMTP_PORT: "1025"
  MAILPIT_MAX_MESSAGES: "5000"
  JWT_ISSUER: banquito-identity-access
  IDENTITY_SERVER_PORT: "8081"
  CUSTOMER_SERVER_PORT: "8082"
  ADMIN_SERVER_PORT: "8083"
  ACCOUNTING_SERVER_PORT: "8084"
  ACCOUNT_SERVER_PORT: "8085"
  DOCUMENT_SERVER_PORT: "8086"
  NOTIFICATION_SERVER_PORT: "8087"
  CUSTOMER_GRPC_PORT: "9092"
  ADMIN_GRPC_PORT: "9093"
  ACCOUNTING_GRPC_PORT: "9094"
  DOCUMENT_GRPC_PORT: "9096"
  NOTIFICATION_GRPC_PORT: "9097"
