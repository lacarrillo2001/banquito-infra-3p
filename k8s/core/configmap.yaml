  OUTBOX_DISPATCH_MAX_ATTEMPTS: "5"
  LOG_LEVEL_ROOT: INFO
  LOG_LEVEL_APP: INFO
  DOCUMENT_DEMO_ENABLED: "true"
  DOCUMENT_STORAGE_MODE: MONGODB_PAYLOAD
  DOCUMENT_STORAGE_BASE_PATH: /documents
  SMTP_HOST: mailpit
  SMTP_PORT: "1025"
  SMTP_AUTH: "false"
  SMTP_STARTTLS_ENABLE: "false"
  SMTP_CONNECTION_TIMEOUT: "5000"
  SMTP_TIMEOUT: "5000"
  SMTP_WRITE_TIMEOUT: "5000"
  NOTIFICATION_DELIVERY_MODE: SIMULATED
  NOTIFICATION_PROVIDER: SMTP
  SMTP_FROM: no-reply@banquito.com
  SMTP_REPLY_TO: ""
