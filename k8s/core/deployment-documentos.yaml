apiVersion: apps/v1
kind: Deployment
metadata:
  name: banquito-core-documentos-3p
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: banquito-core-documentos-3p
  template:
    metadata:
      labels:
        app: banquito-core-documentos-3p
    spec:
      serviceAccountName: banquito-core-apps
      containers:
        - name: banquito-core-documentos-3p
          image: us-central1-docker.pkg.dev/banquitog2-p3/banquito/banquito-core-documentos:prod
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8086
            - name: grpc
              containerPort: 9096
          envFrom:
            - configMapRef:
                name: banquito-core-config
            - secretRef:
                name: core-secrets
          env:
            - name: SPRING_APPLICATION_NAME
              value: document-service
            - name: SERVER_PORT
              valueFrom:
                configMapKeyRef:
                  name: banquito-core-config
                  key: DOCUMENT_SERVER_PORT
            - name: MANAGEMENT_HEALTH_MONGO_ENABLED
              value: "false"
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 60
            periodSeconds: 20
          startupProbe:
            tcpSocket:
              port: http
            failureThreshold: 30
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 768Mi
---
apiVersion: v1
kind: Service
metadata:
  name: banquito-core-documentos-3p
  annotations:
    cloud.google.com/backend-config: '{"ports":{"8086":"banquito-core-documentos-backendconfig"}}'
spec:
  selector:
    app: banquito-core-documentos-3p
  ports:
    - name: http
      port: 8086
      targetPort: http
    - name: grpc
      port: 9096
      targetPort: grpc
