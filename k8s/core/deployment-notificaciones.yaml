apiVersion: apps/v1
kind: Deployment
metadata:
  name: banquito-core-notificaciones-3p
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: banquito-core-notificaciones-3p
  template:
    metadata:
      labels:
        app: banquito-core-notificaciones-3p
    spec:
      serviceAccountName: banquito-core-apps
      containers:
        - name: banquito-core-notificaciones-3p
          image: us-central1-docker.pkg.dev/banquitog2-p3/banquito/banquito-core-notificaciones:prod
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8087
            - name: grpc
              containerPort: 9097
          envFrom:
            - configMapRef:
                name: banquito-core-config
            - secretRef:
                name: core-secrets
          env:
            - name: SPRING_APPLICATION_NAME
              value: notification-service
            - name: SERVER_PORT
              valueFrom:
                configMapKeyRef:
                  name: banquito-core-config
                  key: NOTIFICATION_SERVER_PORT
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 20
          startupProbe:
            httpGet:
              path: /actuator/health
              port: http
            failureThreshold: 30
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 768Mi
---
apiVersion: v1
kind: Service
metadata:
  name: banquito-core-notificaciones-3p
spec:
  selector:
    app: banquito-core-notificaciones-3p
  ports:
    - name: http
      port: 8087
      targetPort: http
    - name: grpc
      port: 9097
      targetPort: grpc
