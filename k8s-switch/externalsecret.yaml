apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: banquito-switch-secret-store
spec:
  provider:
    gcpsm:
      projectID: banquitog2-p3
      auth:
        workloadIdentity:
          clusterLocation: us-central1
          clusterName: banquito-cluster
          clusterProjectID: banquitog2-p3
          serviceAccountRef:
            name: banquito-switch-apps
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: switch-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: banquito-switch-secret-store
  target:
    name: switch-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: switch
